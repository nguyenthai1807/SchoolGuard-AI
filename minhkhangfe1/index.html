<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SchoolGuard AI</title>
<link rel="stylesheet" href="style.css"></head><body><button type="button" id="themeToggle" class="theme-toggle" aria-label="Chuyển giao diện" aria-pressed="false"><span id="themeIcon" aria-hidden="true">☾</span><span id="themeLabel">Chế độ tối</span></button>

<script src="script.js" defer></script></body></html>
