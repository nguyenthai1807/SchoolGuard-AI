[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schoolguard-ai-worker"
version = "0.1.0"
description = "SchoolGuard AI restricted-zone video analytics (BE-1)"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.3,<9",
    "opencv-python>=4.10,<6",
    "numpy>=1.26,<3",
    "lap>=0.5.12,<1",
    "imageio-ffmpeg>=0.5,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
schoolguard-ai = "schoolguard_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
